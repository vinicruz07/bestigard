[workspace]
resolver = "2"
members = [
    "crates/game_core",
    "crates/engine",
    "crates/mobile_entry",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Bestigard Contributors"]
license = "MIT OR Apache-2.0"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
